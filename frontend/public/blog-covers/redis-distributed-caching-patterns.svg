<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Markers for arrows -->
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#71717a" />
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrSky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e" />
    </marker>

    <!-- Minimal subtle grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.02"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="#27272a" stroke-width="1" />

  <!-- Diagram Content -->
  
  <g transform="translate(60, 70)">
    <!-- 1. Database Query Bottleneck -->
    <g transform="translate(20, 155)">
      <rect x="0" y="0" width="200" height="90" rx="8" fill="#18181b" stroke="#f43f5e" stroke-width="1.2" />
      <text x="100" y="28" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10.5" font-weight="600" fill="#f43f5e">UNINDEXED QUERY</text>
      <text x="100" y="48" text-anchor="middle" font-family="'Geist', sans-serif" font-size="12.5" font-weight="600" fill="#f4f4f5">EXPLAIN (ANALYZE, BUFFERS)</text>
      <text x="100" y="68" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9.5" fill="#f43f5e">82,450 Shared Blocks (Disk Thrash)</text>
    </g>

    <path d="M 220 200 L 300 200" stroke="#71717a" stroke-width="1.5" marker-end="url(#arr)" />

    <!-- 2. Composite B-Tree Optimization -->
    <g transform="translate(300, 115)">
      <rect x="0" y="0" width="270" height="170" rx="10" fill="#121215" stroke="#52525b" stroke-width="1.5" />
      <text x="135" y="30" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="11" font-weight="700" fill="#e4e4e7">COMPOSITE B-TREE INDEX</text>
      <text x="135" y="48" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" fill="#71717a">(contest_id, score DESC, time ASC)</text>

      <rect x="15" y="65" width="240" height="48" rx="6" fill="#18181b" stroke="#10b981" stroke-width="1" />
      <text x="135" y="85" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10.5" font-weight="600" fill="#10b981">18 Shared Buffer Reads</text>
      <text x="135" y="101" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#a1a1aa">Execution time: 1,840ms -> 0.8ms (2,300x)</text>

      <text x="135" y="145" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9.5" fill="#a1a1aa">Index-Only Scan on PostgreSQL</text>
    </g>

    <path d="M 570 200 L 650 200" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrGreen)" />

    <!-- 3. XFetch Cache Stampede Elimination -->
    <g transform="translate(650, 95)">
      <rect x="0" y="0" width="370" height="210" rx="10" fill="#121215" stroke="#10b981" stroke-width="1.5" />
      <text x="30" y="32" font-family="'Geist Mono', monospace" font-size="12" font-weight="700" fill="#10b981">XFETCH PROBABILISTIC CACHING</text>
      <text x="30" y="50" font-family="'Geist Mono', monospace" font-size="10" fill="#71717a">Stampede (Thundering Herd) Elimination</text>

      <rect x="20" y="68" width="330" height="52" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
      <text x="185" y="88" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#f4f4f5">Probabilistic Early Expiration</text>
      <text x="185" y="105" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#38bdf8">-beta * delta * ln(random()) &gt; TTL_remaining</text>

      <text x="30" y="148" font-family="'Geist Mono', monospace" font-size="9.5" fill="#a1a1aa">• Single background worker proactively refreshes</text>
      <text x="30" y="168" font-family="'Geist Mono', monospace" font-size="9.5" fill="#a1a1aa">• Concurrent requests continue receiving 1ms cache hits</text>
      <text x="30" y="188" font-family="'Geist Mono', monospace" font-size="9.5" fill="#10b981">✓ Zero p99 latency spikes during cache expiration</text>
    </g>
  </g>

  <!-- Clean Bottom Corner Signature -->
  <g transform="translate(64, 580)">
    <text font-family="'Geist Mono', 'SF Mono', 'Fira Code', monospace" font-size="13" font-weight="500" fill="#71717a">By Santusht Kotai</text>
  </g>
</svg>