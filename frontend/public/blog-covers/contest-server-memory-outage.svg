<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Ultra-subtle linear background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Subtle radial glow from top-left -->
    <radialGradient id="topGlow" cx="15%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Minimal grid pattern -->
    <pattern id="cleanGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.025"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />
  <rect width="1200" height="630" fill="url(#topGlow)" />
  <rect width="1200" height="630" fill="url(#cleanGrid)" />

  <!-- Outer Minimal Border Frame -->
  <rect x="32" y="32" width="1136" height="566" rx="16" fill="none" stroke="#27272a" stroke-width="1" stroke-opacity="0.8" />

  <!-- Category Tag -->
  <g transform="translate(96, 120)">
    <text font-family="'Geist Mono', 'SF Mono', 'Fira Code', monospace" font-size="13" font-weight="600" fill="#71717a" letter-spacing="0.1em">// INCIDENT · INFRASTRUCTURE</text>
  </g>

  <!-- Main Title & Subtitle -->
  <g>
    <text x="96" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" fill="#fafafa" letter-spacing="-0.03em">When a 4GB Node Suffocated</text>
    <text x="96" y="333" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" fill="#fafafa" letter-spacing="-0.03em">Under Concurrent Contest Traffic</text>
    <text x="96" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#a1a1aa" letter-spacing="-0.01em">Post-mortem of swap thrashing and kernel OOM cascades under load.</text>
  </g>

  <!-- Clean Bottom Metadata Bar -->
  <g transform="translate(96, 524)">
    <!-- Username on left -->
    <text font-family="'Geist Mono', 'SF Mono', 'Fira Code', monospace" font-size="15" font-weight="500" fill="#a1a1aa">santusht06</text>
    
    <!-- Clean minimal site domain on right -->
    <text x="1008" y="0" text-anchor="end" font-family="'Geist Mono', 'SF Mono', 'Fira Code', monospace" font-size="14" font-weight="400" fill="#52525b">santusht.online</text>
  </g>
</svg>