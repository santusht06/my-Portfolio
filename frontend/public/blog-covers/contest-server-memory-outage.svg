<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Markers for arrows -->
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#71717a" />
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrSky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e" />
    </marker>

    <!-- Minimal subtle grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.02"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="#27272a" stroke-width="1" />

  <!-- Diagram Content -->
  
  <g transform="translate(70, 80)">
    <!-- Traffic Surge -->
    <g transform="translate(30, 160)">
      <rect x="0" y="0" width="180" height="80" rx="8" fill="#18181b" stroke="#f43f5e" stroke-width="1.2" />
      <text x="90" y="32" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10.5" font-weight="600" fill="#f43f5e">TRAFFIC SPIKE</text>
      <text x="90" y="52" text-anchor="middle" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#f4f4f5">300+ Contestants</text>
      <text x="90" y="68" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9.5" fill="#71717a">Simultaneous kickoff burst</text>
    </g>

    <path d="M 210 200 L 300 200" stroke="#71717a" stroke-width="1.5" marker-end="url(#arr)" />

    <!-- Gateway & Semaphore -->
    <g transform="translate(300, 130)">
      <rect x="0" y="0" width="210" height="140" rx="10" fill="#121215" stroke="#52525b" stroke-width="1.5" />
      <text x="105" y="30" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="11" font-weight="700" fill="#e4e4e7">FASTAPI GATEWAY</text>
      
      <rect x="15" y="55" width="180" height="55" rx="6" fill="#18181b" stroke="#10b981" stroke-width="1" />
      <text x="105" y="76" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10.5" font-weight="600" fill="#10b981">Token-Bucket Semaphore</text>
      <text x="105" y="95" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9.5" fill="#a1a1aa">Bounded concurrency (max 2/core)</text>
    </g>

    <!-- Decoupled Paths -->
    <path d="M 510 160 L 610 120" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrSky)" />
    <path d="M 510 240 L 610 280" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrGreen)" />

    <!-- Tier 1: State Tier -->
    <g transform="translate(610, 70)">
      <rect x="0" y="0" width="340" height="100" rx="8" fill="#18181b" stroke="#38bdf8" stroke-width="1.2" />
      <text x="20" y="28" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#38bdf8">TIER 1 · STATEFUL NODE (4GB)</text>
      <text x="20" y="50" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#f4f4f5">PostgreSQL Database + Redis Session</text>
      <text x="20" y="70" font-family="'Geist Mono', monospace" font-size="10" fill="#71717a">Dedicated buffer memory pool (1.2GB protected)</text>
      <text x="20" y="86" font-family="'Geist Mono', monospace" font-size="9.5" fill="#10b981">✓ Zero untrusted code execution on DB host</text>
    </g>

    <!-- Tier 2: Compute Workers -->
    <g transform="translate(610, 230)">
      <rect x="0" y="0" width="340" height="100" rx="8" fill="#18181b" stroke="#10b981" stroke-width="1.2" />
      <text x="20" y="28" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#10b981">TIER 2 · STATELESS COMPUTE WORKERS</text>
      <text x="20" y="50" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#f4f4f5">Isolated Docker Evaluation Pool (g++)</text>
      <text x="20" y="70" font-family="'Geist Mono', monospace" font-size="10" fill="#71717a">cgroup v2: memory.max=256m, pids.max=32</text>
      <text x="20" y="86" font-family="'Geist Mono', monospace" font-size="9.5" fill="#38bdf8">✓ vm.swappiness=10 | Eliminates swap thrashing</text>
    </g>
  </g>

  <!-- Clean Bottom Corner Signature -->
  <g transform="translate(64, 580)">
    <text font-family="'Geist Mono', 'SF Mono', 'Fira Code', monospace" font-size="13" font-weight="500" fill="#71717a">By Santusht Kotai</text>
  </g>
</svg>