<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Markers for arrows -->
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#71717a" />
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrSky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e" />
    </marker>

    <!-- Minimal subtle grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.02"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="#27272a" stroke-width="1" />

  <!-- Diagram Content -->
  
  <g transform="translate(80, 70)">
    <!-- 1. Inbound Ingress -->
    <g transform="translate(20, 160)">
      <rect x="0" y="0" width="170" height="85" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
      <text x="85" y="30" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10.5" font-weight="600" fill="#a1a1aa">INBOUND TCP (PORT 25)</text>
      <text x="85" y="52" text-anchor="middle" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#f4f4f5">External MTA Client</text>
      <text x="85" y="70" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9.5" fill="#71717a">STARTTLS Handshake</text>
    </g>

    <path d="M 190 202 L 270 202" stroke="#71717a" stroke-width="1.5" marker-end="url(#arr)" />

    <!-- 2. Async SMTP Engine -->
    <g transform="translate(270, 110)">
      <rect x="0" y="0" width="220" height="185" rx="10" fill="#121215" stroke="#52525b" stroke-width="1.5" />
      <text x="110" y="30" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="11.5" font-weight="700" fill="#e4e4e7">ASYNC SMTP DAEMON</text>
      <text x="110" y="48" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" fill="#71717a">RFC 5321 State Machine</text>

      <rect x="15" y="65" width="190" height="42" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
      <text x="105" y="83" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#f4f4f5">Line-Stuffed Parser</text>
      <text x="105" y="97" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#a1a1aa">Non-blocking streaming byte chunks</text>

      <rect x="15" y="117" width="190" height="48" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
      <text x="105" y="135" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#10b981">DKIM / SPF / DMARC</text>
      <text x="105" y="151" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#a1a1aa">RSA-2048 canonical header sign</text>
    </g>

    <!-- Storage Split Paths -->
    <path d="M 490 160 L 580 120" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrSky)" />
    <path d="M 490 240 L 580 280" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arr)" />

    <!-- 3A. CockroachDB (Metadata Tier) -->
    <g transform="translate(580, 75)">
      <rect x="0" y="0" width="220" height="90" rx="8" fill="#18181b" stroke="#38bdf8" stroke-width="1.2" />
      <text x="20" y="28" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#38bdf8">COCKROACHDB (SQL)</text>
      <text x="20" y="50" font-family="'Geist', sans-serif" font-size="13" font-weight="500" fill="#f4f4f5">Envelope &amp; Mailbox UIDs</text>
      <text x="20" y="68" font-family="'Geist Mono', monospace" font-size="9.5" fill="#71717a">ACID state flags (\Seen, \Flagged)</text>
    </g>

    <!-- 3B. MinIO Object Storage (Blob Tier) -->
    <g transform="translate(580, 235)">
      <rect x="0" y="0" width="220" height="90" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
      <text x="20" y="28" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#a1a1aa">MINIO OBJECT STORAGE</text>
      <text x="20" y="50" font-family="'Geist', sans-serif" font-size="13" font-weight="500" fill="#f4f4f5">MIME Binary Attachments</text>
      <text x="20" y="68" font-family="'Geist Mono', monospace" font-size="9.5" fill="#71717a">Raw RFC 822 encrypted payload</text>
    </g>

    <!-- 4. Client Retrieval Daemons -->
    <path d="M 800 120 L 870 160" stroke="#71717a" stroke-width="1.5" />
    <path d="M 800 280 L 870 240" stroke="#71717a" stroke-width="1.5" />
    <path d="M 870 200 L 910 200" stroke="#71717a" stroke-width="1.5" marker-end="url(#arr)" />

    <g transform="translate(910, 160)">
      <rect x="0" y="0" width="160" height="80" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
      <text x="80" y="30" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10.5" font-weight="600" fill="#a1a1aa">CLIENT ACCESS</text>
      <text x="80" y="50" text-anchor="middle" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#f4f4f5">IMAP &amp; POP3</text>
      <text x="80" y="68" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9.5" fill="#10b981">RFC 3501 UIDVALIDITY</text>
    </g>
  </g>

  <!-- Clean Bottom Corner Signature -->
  <g transform="translate(64, 580)">
    <text font-family="'Geist Mono', 'SF Mono', 'Fira Code', monospace" font-size="13" font-weight="500" fill="#71717a">By Santusht Kotai</text>
  </g>
</svg>