<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Markers for arrows -->
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#71717a" />
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrSky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e" />
    </marker>

    <!-- Minimal subtle grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.02"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="#27272a" stroke-width="1" />

  <!-- Diagram Content -->
  
  <g transform="translate(70, 75)">
    <!-- 1. Evaluation Worker -->
    <g transform="translate(30, 160)">
      <rect x="0" y="0" width="170" height="80" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
      <text x="85" y="30" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10.5" font-weight="600" fill="#a1a1aa">EVALUATION WORKER</text>
      <text x="85" y="50" text-anchor="middle" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#f4f4f5">Test Case Progress</text>
      <text x="85" y="68" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9.5" fill="#10b981">XADD with seq_id</text>
    </g>

    <path d="M 200 200 L 290 200" stroke="#71717a" stroke-width="1.5" marker-end="url(#arr)" />

    <!-- 2. Redis Streams Replay Broker -->
    <g transform="translate(290, 115)">
      <rect x="0" y="0" width="260" height="170" rx="10" fill="#121215" stroke="#52525b" stroke-width="1.5" />
      <text x="130" y="30" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="11.5" font-weight="700" fill="#e4e4e7">PERSISTENT REDIS STREAMS</text>
      <text x="130" y="48" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" fill="#71717a">submission:events Buffer</text>

      <rect x="15" y="65" width="230" height="45" rx="6" fill="#18181b" stroke="#38bdf8" stroke-width="1" />
      <text x="130" y="85" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#38bdf8">Stream Range Storage</text>
      <text x="130" y="99" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#a1a1aa">Preserves full event chronology</text>

      <text x="130" y="145" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9.5" fill="#10b981">Replay from Last-Event-ID</text>
    </g>

    <path d="M 550 200 L 640 200" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrGreen)" />
    <text x="595" y="190" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" fill="#10b981">SSE STREAM</text>

    <!-- 3. Client Idempotent Reducer -->
    <g transform="translate(640, 110)">
      <rect x="0" y="0" width="310" height="180" rx="10" fill="#121215" stroke="#10b981" stroke-width="1.5" />
      <text x="30" y="32" font-family="'Geist Mono', monospace" font-size="12" font-weight="700" fill="#10b981">BROWSER EVENTSOURCE CLIENT</text>
      <text x="30" y="50" font-family="'Geist Mono', monospace" font-size="10" fill="#71717a">Idempotent State Reconciliation</text>

      <rect x="20" y="70" width="270" height="45" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
      <text x="155" y="90" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#f4f4f5">Monotonic Sequence Guard</text>
      <text x="155" y="104" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#a1a1aa">Drops duplicate / out-of-order frames</text>

      <text x="30" y="145" font-family="'Geist Mono', monospace" font-size="9.5" fill="#38bdf8">✓ Automatic reconnect with HTTP Last-Event-ID</text>
      <text x="30" y="165" font-family="'Geist Mono', monospace" font-size="9.5" fill="#10b981">✓ Zero UI flickering across network jitter</text>
    </g>
  </g>

  <!-- Clean Bottom Corner Signature -->
  <g transform="translate(64, 580)">
    <text font-family="'Geist Mono', 'SF Mono', 'Fira Code', monospace" font-size="13" font-weight="500" fill="#71717a">By Santusht Kotai</text>
  </g>
</svg>