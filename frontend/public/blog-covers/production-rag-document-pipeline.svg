<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Markers for arrows -->
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#71717a" />
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrSky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e" />
    </marker>

    <!-- Minimal subtle grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.02"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="#27272a" stroke-width="1" />

  <!-- Diagram Content -->
  
  <g transform="translate(80, 80)">
    <!-- 1. Document Ingestion -->
    <g transform="translate(20, 150)">
      <rect x="0" y="0" width="160" height="90" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
      <text x="80" y="28" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10.5" font-weight="600" fill="#a1a1aa">TECHNICAL PDFS</text>
      <text x="80" y="48" text-anchor="middle" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#f4f4f5">Layout OCR Model</text>
      <text x="80" y="68" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9.5" fill="#10b981">Table Markdown Grids</text>
    </g>

    <path d="M 180 195 L 260 195" stroke="#71717a" stroke-width="1.5" marker-end="url(#arr)" />

    <!-- 2. Dual Indexing Tier -->
    <g transform="translate(260, 95)">
      <rect x="0" y="0" width="230" height="200" rx="10" fill="#121215" stroke="#52525b" stroke-width="1.5" />
      <text x="115" y="30" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="11" font-weight="700" fill="#e4e4e7">DUAL INDEXING TIER</text>

      <rect x="15" y="55" width="200" height="55" rx="6" fill="#18181b" stroke="#38bdf8" stroke-width="1" />
      <text x="115" y="76" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#38bdf8">Dense Vector Index</text>
      <text x="115" y="94" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#a1a1aa">pgvector · HNSW Index (Cosine)</text>

      <rect x="15" y="125" width="200" height="55" rx="6" fill="#18181b" stroke="#a1a1aa" stroke-width="1" />
      <text x="115" y="146" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#f4f4f5">Lexical Keyword Index</text>
      <text x="115" y="164" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#a1a1aa">PostgreSQL tsvector (BM25)</text>
    </g>

    <!-- Paths to RRF -->
    <path d="M 490 150 L 560 180" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 490 220 L 560 210" stroke="#a1a1aa" stroke-width="1.5" />
    <path d="M 560 195 L 590 195" stroke="#71717a" stroke-width="1.5" marker-end="url(#arr)" />

    <!-- 3. RRF Fusion -->
    <g transform="translate(590, 140)">
      <rect x="0" y="0" width="170" height="110" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
      <text x="85" y="28" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10.5" font-weight="600" fill="#f4f4f5">FUSION STAGE</text>
      <text x="85" y="50" text-anchor="middle" font-family="'Geist', sans-serif" font-size="12.5" font-weight="600" fill="#34d399">RRF Rank Scoring</text>
      <text x="85" y="72" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9.5" fill="#a1a1aa">1 / (60 + Rank)</text>
      <text x="85" y="90" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#71717a">Top-40 candidates</text>
    </g>

    <path d="M 760 195 L 830 195" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrGreen)" />

    <!-- 4. Neural Reranking -->
    <g transform="translate(830, 135)">
      <rect x="0" y="0" width="200" height="120" rx="10" fill="#121215" stroke="#10b981" stroke-width="1.5" />
      <text x="100" y="30" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="11" font-weight="700" fill="#10b981">CROSS-ENCODER</text>
      <text x="100" y="52" text-anchor="middle" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#f4f4f5">bge-reranker-large</text>
      <text x="100" y="74" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9.5" fill="#a1a1aa">Deep joint attention</text>
      <text x="100" y="94" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#10b981">✓ 38% higher precision</text>
    </g>
  </g>

  <!-- Clean Bottom Corner Signature -->
  <g transform="translate(64, 580)">
    <text font-family="'Geist Mono', 'SF Mono', 'Fira Code', monospace" font-size="13" font-weight="500" fill="#71717a">By Santusht Kotai</text>
  </g>
</svg>