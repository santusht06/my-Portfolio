<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Markers for arrows -->
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#71717a" />
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrSky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e" />
    </marker>

    <!-- Minimal subtle grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.02"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="#27272a" stroke-width="1" />

  <!-- Diagram Content -->
  
  <g transform="translate(70, 75)">
    <!-- 1. Central Cloud Orchestrator -->
    <g transform="translate(30, 120)">
      <rect x="0" y="0" width="230" height="160" rx="10" fill="#121215" stroke="#38bdf8" stroke-width="1.5" />
      <text x="115" y="32" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8">CLOUD ORCHESTRATOR</text>
      <text x="115" y="50" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" fill="#71717a">Public IP · AWS EC2</text>

      <rect x="15" y="70" width="200" height="40" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
      <text x="115" y="94" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#f4f4f5">Pending Task Queue</text>

      <text x="115" y="135" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#10b981">HMAC-SHA256 Auth Handshake</text>
    </g>

    <!-- Outbound WebSocket Tunnel (Bypassing CGNAT) -->
    <path d="M 540 185 L 260 185" stroke="#10b981" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrGreen)" />
    <text x="400" y="170" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10.5" font-weight="600" fill="#10b981">OUTBOUND wss:// (PORT 443 TLS)</text>
    <text x="400" y="205" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9.5" fill="#f43f5e">Bypasses Residential CGNAT &amp; Firewalls</text>

    <!-- 2. Local Apple Silicon Daemon -->
    <g transform="translate(540, 95)">
      <rect x="0" y="0" width="420" height="210" rx="10" fill="#121215" stroke="#52525b" stroke-width="1.5" />
      <text x="30" y="32" font-family="'Geist Mono', monospace" font-size="12" font-weight="700" fill="#e4e4e7">LOCAL COMPUTE DAEMON</text>
      <text x="30" y="50" font-family="'Geist Mono', monospace" font-size="10" fill="#71717a">Residential Machine · Behind Dynamic NAT</text>

      <!-- Sub-blocks: Metal + Docker -->
      <g transform="translate(25, 70)">
        <rect x="0" y="0" width="175" height="110" rx="8" fill="#18181b" stroke="#34d399" stroke-width="1.2" />
        <text x="20" y="26" font-family="'Geist Mono', monospace" font-size="10.5" font-weight="600" fill="#34d399">Apple Silicon Metal</text>
        <text x="20" y="48" font-family="'Geist', sans-serif" font-size="12" font-weight="500" fill="#f4f4f5">MPS GPU Engine</text>
        <text x="20" y="70" font-family="'Geist Mono', monospace" font-size="9" fill="#a1a1aa">36GB Unified RAM</text>
        <text x="20" y="90" font-family="'Geist Mono', monospace" font-size="9" fill="#10b981">Zero-copy tensor eval</text>
      </g>

      <g transform="translate(215, 70)">
        <rect x="0" y="0" width="180" height="110" rx="8" fill="#18181b" stroke="#38bdf8" stroke-width="1.2" />
        <text x="20" y="26" font-family="'Geist Mono', monospace" font-size="10.5" font-weight="600" fill="#38bdf8">Local Docker Sandbox</text>
        <text x="20" y="48" font-family="'Geist', sans-serif" font-size="12" font-weight="500" fill="#f4f4f5">Integration Test Pool</text>
        <text x="20" y="70" font-family="'Geist Mono', monospace" font-size="9" fill="#a1a1aa">Ephemeral containers</text>
        <text x="20" y="90" font-family="'Geist Mono', monospace" font-size="9" fill="#10b981">Ping-pong 10s heartbeat</text>
      </g>
    </g>
  </g>

  <!-- Clean Bottom Corner Signature -->
  <g transform="translate(64, 580)">
    <text font-family="'Geist Mono', 'SF Mono', 'Fira Code', monospace" font-size="13" font-weight="500" fill="#71717a">By Santusht Kotai</text>
  </g>
</svg>