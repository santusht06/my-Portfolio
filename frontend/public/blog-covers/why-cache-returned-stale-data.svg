<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Markers for arrows -->
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#71717a" />
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrSky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e" />
    </marker>

    <!-- Minimal subtle grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.02"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="#27272a" stroke-width="1" />

  <!-- Diagram Content -->
  
  <g transform="translate(60, 70)">
    <!-- 1. Write Mutation Worker -->
    <g transform="translate(30, 160)">
      <rect x="0" y="0" width="180" height="85" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
      <text x="90" y="30" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10.5" font-weight="600" fill="#a1a1aa">JUDGE WORKER</text>
      <text x="90" y="50" text-anchor="middle" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#f4f4f5">Score Mutation</text>
      <text x="90" y="68" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9.5" fill="#38bdf8">Transactional Outbox</text>
    </g>

    <path d="M 210 202 L 290 202" stroke="#71717a" stroke-width="1.5" marker-end="url(#arr)" />

    <!-- 2. PostgreSQL WAL & DB -->
    <g transform="translate(290, 120)">
      <rect x="0" y="0" width="240" height="165" rx="10" fill="#121215" stroke="#52525b" stroke-width="1.5" />
      <text x="120" y="30" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="11" font-weight="700" fill="#e4e4e7">POSTGRESQL (ACID)</text>
      <text x="120" y="48" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" fill="#71717a">outbox_events Table</text>

      <rect x="15" y="65" width="210" height="42" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
      <text x="120" y="83" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#38bdf8">Commit Finalized to WAL</text>
      <text x="120" y="97" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#a1a1aa">Guaranteed serialization order</text>

      <circle cx="28" cy="138" r="4" fill="#10b981" />
      <text x="38" y="142" font-family="'Geist Mono', monospace" font-size="9.5" fill="#a1a1aa">CDC Log Listener Tails WAL</text>
    </g>

    <path d="M 530 202 L 610 202" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrGreen)" />
    <text x="570" y="192" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" fill="#10b981">COMMIT</text>

    <!-- 3. Redis Invalidation & Versioned Hashes -->
    <g transform="translate(610, 110)">
      <rect x="0" y="0" width="280" height="185" rx="10" fill="#121215" stroke="#10b981" stroke-width="1.5" />
      <text x="140" y="30" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="11.5" font-weight="700" fill="#10b981">REDIS VERSIONED HASH</text>
      <text x="140" y="48" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" fill="#71717a">Atomic Invalidation &amp; Mutex Lease</text>

      <rect x="15" y="65" width="250" height="48" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
      <text x="140" y="84" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#f4f4f5">Distributed Mutex Lease</text>
      <text x="140" y="100" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#a1a1aa">SET lock:leaderboard NX EX 2</text>

      <rect x="15" y="122" width="250" height="48" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
      <text x="140" y="141" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#f4f4f5">Monotonic Epoch Lua Guard</text>
      <text x="140" y="157" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#10b981">Reject writes if incoming_version &lt;= stored</text>
    </g>

    <!-- 4. Client Read Output -->
    <path d="M 890 202 L 950 202" stroke="#71717a" stroke-width="1.5" marker-end="url(#arr)" />

    <g transform="translate(950, 160)">
      <rect x="0" y="0" width="130" height="85" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
      <text x="65" y="32" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10.5" font-weight="600" fill="#10b981">READ PATH</text>
      <text x="65" y="52" text-anchor="middle" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#f4f4f5">Consistent</text>
      <text x="65" y="70" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#71717a">0 Stale reads</text>
    </g>
  </g>

  <!-- Clean Bottom Corner Signature -->
  <g transform="translate(64, 580)">
    <text font-family="'Geist Mono', 'SF Mono', 'Fira Code', monospace" font-size="13" font-weight="500" fill="#71717a">By Santusht Kotai</text>
  </g>
</svg>