<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Markers for arrows -->
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#71717a" />
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrSky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e" />
    </marker>

    <!-- Minimal subtle grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.02"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="#27272a" stroke-width="1" />

  <!-- Diagram Content -->
  
  <g transform="translate(70, 70)">
    <!-- 1. API Ingress -->
    <g transform="translate(30, 160)">
      <rect x="0" y="0" width="160" height="80" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
      <text x="80" y="30" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10.5" font-weight="600" fill="#a1a1aa">API INGRESS</text>
      <text x="80" y="52" text-anchor="middle" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#f4f4f5">Kong Gateway</text>
    </g>

    <path d="M 190 200 L 270 200" stroke="#71717a" stroke-width="1.5" marker-end="url(#arr)" />

    <!-- 2. Polyglot Microservices Grid -->
    <g transform="translate(270, 70)">
      <rect x="0" y="0" width="310" height="260" rx="10" fill="#121215" stroke="#52525b" stroke-width="1.5" />
      <text x="155" y="30" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="11.5" font-weight="700" fill="#e4e4e7">SUPABASE ECOSYSTEM</text>
      <text x="155" y="48" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" fill="#71717a">Polyglot Multi-Service Topology</text>

      <g transform="translate(15, 65)">
        <rect x="0" y="0" width="280" height="50" rx="6" fill="#18181b" stroke="#38bdf8" stroke-width="1" />
        <text x="20" y="24" font-family="'Geist Mono', monospace" font-size="10.5" font-weight="600" fill="#38bdf8">GoTrue (Go)</text>
        <text x="20" y="40" font-family="'Geist Mono', monospace" font-size="9" fill="#a1a1aa">Authentication &amp; JWT token issuing</text>
      </g>

      <g transform="translate(15, 125)">
        <rect x="0" y="0" width="280" height="50" rx="6" fill="#18181b" stroke="#10b981" stroke-width="1" />
        <text x="20" y="24" font-family="'Geist Mono', monospace" font-size="10.5" font-weight="600" fill="#10b981">PostgREST (Haskell / C)</text>
        <text x="20" y="40" font-family="'Geist Mono', monospace" font-size="9" fill="#a1a1aa">Instant REST API over PostgreSQL schema</text>
      </g>

      <g transform="translate(15, 185)">
        <rect x="0" y="0" width="280" height="55" rx="6" fill="#18181b" stroke="#a855f7" stroke-width="1" />
        <text x="20" y="24" font-family="'Geist Mono', monospace" font-size="10.5" font-weight="600" fill="#a855f7">Realtime (Elixir / BEAM VM)</text>
        <text x="20" y="42" font-family="'Geist Mono', monospace" font-size="9" fill="#a1a1aa">Tails WAL logical decoding via WebSockets</text>
      </g>
    </g>

    <!-- 3. PostgreSQL Database Core -->
    <path d="M 580 200 L 670 200" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrSky)" />

    <g transform="translate(670, 115)">
      <rect x="0" y="0" width="310" height="170" rx="10" fill="#121215" stroke="#38bdf8" stroke-width="1.5" />
      <text x="155" y="32" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="11.5" font-weight="700" fill="#38bdf8">POSTGRESQL KERNEL</text>
      <text x="155" y="50" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" fill="#71717a">ACID Core &amp; Extensions</text>

      <rect x="20" y="70" width="270" height="42" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
      <text x="135" y="88" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#f4f4f5">C Extensions (pgvector)</text>
      <text x="135" y="102" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#a1a1aa">In-database vector similarity</text>

      <rect x="20" y="120" width="270" height="35" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
      <text x="135" y="142" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9.5" fill="#10b981">✓ Docker Compose E2E Integration Suite</text>
    </g>
  </g>

  <!-- Clean Bottom Corner Signature -->
  <g transform="translate(64, 580)">
    <text font-family="'Geist Mono', 'SF Mono', 'Fira Code', monospace" font-size="13" font-weight="500" fill="#71717a">By Santusht Kotai</text>
  </g>
</svg>