<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Markers for arrows -->
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#71717a" />
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrSky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e" />
    </marker>

    <!-- Minimal subtle grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.02"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="#27272a" stroke-width="1" />

  <!-- Diagram Content -->
  
  <g transform="translate(70, 75)">
    <!-- Inbound HTTP -->
    <g transform="translate(30, 160)">
      <rect x="0" y="0" width="160" height="80" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
      <text x="80" y="30" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10.5" font-weight="600" fill="#a1a1aa">INBOUND TRAFFIC</text>
      <text x="80" y="52" text-anchor="middle" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#f4f4f5">HTTP/2 Gateway</text>
      <text x="80" y="68" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#71717a">10,000+ daily reqs</text>
    </g>

    <path d="M 190 200 L 270 200" stroke="#71717a" stroke-width="1.5" marker-end="url(#arr)" />

    <!-- FastAPI Event Loop -->
    <g transform="translate(270, 125)">
      <rect x="0" y="0" width="240" height="150" rx="10" fill="#121215" stroke="#52525b" stroke-width="1.5" />
      <text x="120" y="30" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="11" font-weight="700" fill="#e4e4e7">FASTAPI ASYNCIO LOOP</text>
      <text x="120" y="48" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" fill="#71717a">Single Threaded Non-Blocking</text>

      <rect x="15" y="65" width="210" height="55" rx="6" fill="#18181b" stroke="#10b981" stroke-width="1" />
      <text x="120" y="86" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10.5" font-weight="600" fill="#10b981">Zero-Allocation Auth</text>
      <text x="120" y="104" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#a1a1aa">Stateless JWT claims in Depends</text>
    </g>

    <!-- Bifurcation Paths -->
    <path d="M 510 160 L 600 120" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrGreen)" />
    <path d="M 510 240 L 600 280" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr)" />

    <!-- Pure Async I/O Tier -->
    <g transform="translate(600, 75)">
      <rect x="0" y="0" width="310" height="90" rx="8" fill="#18181b" stroke="#10b981" stroke-width="1.2" />
      <text x="20" y="28" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#10b981">ASYNC I/O (NON-BLOCKING)</text>
      <text x="20" y="50" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#f4f4f5">SQLAlchemy AsyncEngine</text>
      <text x="20" y="70" font-family="'Geist Mono', monospace" font-size="9.5" fill="#71717a">pool_size=20 | pool_pre_ping=True</text>
    </g>

    <!-- Blocking Worker Offload -->
    <g transform="translate(600, 235)">
      <rect x="0" y="0" width="310" height="90" rx="8" fill="#18181b" stroke="#f59e0b" stroke-width="1.2" />
      <text x="20" y="28" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#f59e0b">BLOCKING CPU OFFLOAD</text>
      <text x="20" y="50" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#f4f4f5">anyio.to_thread.run_sync</text>
      <text x="20" y="70" font-family="'Geist Mono', monospace" font-size="9.5" fill="#71717a">Isolates Bcrypt hashing &amp; synchronous disk I/O</text>
    </g>
  </g>

  <!-- Clean Bottom Corner Signature -->
  <g transform="translate(64, 580)">
    <text font-family="'Geist Mono', 'SF Mono', 'Fira Code', monospace" font-size="13" font-weight="500" fill="#71717a">By Santusht Kotai</text>
  </g>
</svg>