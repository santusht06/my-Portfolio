<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Markers for arrows -->
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#71717a" />
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrSky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e" />
    </marker>

    <!-- Minimal subtle grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.02"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="#27272a" stroke-width="1" />

  <!-- Diagram Content -->
  
  <g transform="translate(60, 65)">
    <!-- 1. Enqueue -->
    <g transform="translate(40, 175)">
      <rect x="0" y="0" width="180" height="80" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
      <text x="90" y="32" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#a1a1aa">TASK PRODUCER</text>
      <text x="90" y="52" text-anchor="middle" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#f4f4f5">ChaosQueue Client</text>
    </g>

    <path d="M 220 215 L 310 215" stroke="#71717a" stroke-width="1.5" marker-end="url(#arr)" />
    <text x="265" y="205" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10.5" fill="#71717a">XADD</text>

    <!-- 2. Redis State Machine -->
    <g transform="translate(310, 105)">
      <rect x="0" y="0" width="280" height="220" rx="10" fill="#121215" stroke="#52525b" stroke-width="1.5" />
      <text x="140" y="30" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="12" font-weight="700" fill="#e4e4e7">CHAOSQUEUE ENGINE</text>
      <text x="140" y="48" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" fill="#71717a">Zero-dependency Redis Streams</text>

      <rect x="15" y="65" width="250" height="50" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
      <text x="140" y="86" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10.5" font-weight="600" fill="#f4f4f5">Pending Entries List (PEL)</text>
      <text x="140" y="102" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#a1a1aa">In-flight lease tracking</text>

      <rect x="15" y="125" width="250" height="50" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
      <text x="140" y="146" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10.5" font-weight="600" fill="#38bdf8">Atomic Lua State Machine</text>
      <text x="140" y="162" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#a1a1aa">Single-threaded claim &amp; lease updates</text>

      <circle cx="30" cy="198" r="4" fill="#10b981" />
      <text x="42" y="202" font-family="'Geist Mono', monospace" font-size="9.5" fill="#a1a1aa">Guaranteed at-least-once delivery</text>
    </g>

    <!-- Worker Dispatch -->
    <path d="M 590 170 L 690 130" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrGreen)" />
    <path d="M 590 260 L 690 300" stroke="#71717a" stroke-width="1.5" marker-end="url(#arr)" />

    <!-- 3. Workers -->
    <g transform="translate(690, 90)">
      <rect x="0" y="0" width="260" height="80" rx="8" fill="#18181b" stroke="#10b981" stroke-width="1.2" />
      <text x="20" y="28" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#10b981">ASYNC WORKER #1</text>
      <text x="20" y="50" font-family="'Geist', sans-serif" font-size="13" font-weight="500" fill="#f4f4f5">Job Complete</text>
      <text x="20" y="68" font-family="'Geist Mono', monospace" font-size="10" fill="#71717a">XACK -> Purged from PEL</text>
    </g>

    <g transform="translate(690, 260)">
      <rect x="0" y="0" width="260" height="80" rx="8" fill="#18181b" stroke="#f43f5e" stroke-width="1.2" />
      <text x="20" y="28" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#f43f5e">WORKER CRASH (OOM)</text>
      <text x="20" y="50" font-family="'Geist', sans-serif" font-size="13" font-weight="500" fill="#f4f4f5">Orphan Task in PEL</text>
      <text x="20" y="68" font-family="'Geist Mono', monospace" font-size="10" fill="#71717a">XCLAIM -> Reassigned after 30s</text>
    </g>

    <!-- 4. DLQ -->
    <g transform="translate(690, 365)">
      <rect x="0" y="0" width="260" height="50" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1" stroke-dasharray="3 3" />
      <text x="130" y="30" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" fill="#a1a1aa">Dead-Letter Queue (retries > 5)</text>
    </g>
  </g>

  <!-- Clean Bottom Corner Signature -->
  <g transform="translate(64, 580)">
    <text font-family="'Geist Mono', 'SF Mono', 'Fira Code', monospace" font-size="13" font-weight="500" fill="#71717a">By Santusht Kotai</text>
  </g>
</svg>