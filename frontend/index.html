<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Favicon Suite: Google Search (requires 48px multiples), iOS, Android, and desktop browsers -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark light" />

    <!-- Fonts: non-render-blocking (preload + swap) so text paints immediately -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600;700&family=Geist:wght@300;400;500;600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600;700&family=Geist:wght@300;400;500;600;700;800&display=swap"
      />
    </noscript>

    <!--
      SEO tags below are the dev/fallback defaults. scripts/prerender.js rewrites
      every one of them per route at build time (and FAILS the build if a tag is
      missing), so the values here must keep this exact tag shape.
    -->
    <title>Santusht Kotai — Software Engineer &amp; Systems Architect</title>
    <meta name="description" content="Santusht Kotai is a backend and distributed systems engineer from Indore, India. Explore FastAPI APIs, Redis engines, GSoC Supabase work, and technical articles." />
    <meta name="author" content="Santusht Kotai" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://santusht.online/" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Santusht Kotai" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://santusht.online/" />
    <meta property="og:title" content="Santusht Kotai — Software Engineer &amp; Systems Architect" />
    <meta property="og:description" content="Santusht Kotai is a backend and distributed systems engineer from Indore, India. Explore FastAPI APIs, Redis engines, GSoC Supabase work, and technical articles." />
    <meta property="og:image" content="https://santusht.online/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Santusht Kotai — Software Engineer, Backend &amp; Distributed Systems" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://santusht.online/" />
    <meta name="twitter:title" content="Santusht Kotai — Software Engineer &amp; Systems Architect" />
    <meta name="twitter:description" content="Santusht Kotai is a backend and distributed systems engineer from Indore, India. Explore FastAPI APIs, Redis engines, GSoC Supabase work, and technical articles." />
    <meta name="twitter:image" content="https://santusht.online/og-image.jpg" />
    <meta name="twitter:image:alt" content="Santusht Kotai — Software Engineer, Backend &amp; Distributed Systems" />

    <!--
      Crawlable pre-rendered content lives inside #root (React replaces it on
      mount). It is invisible for the first 2.5s so normal visitors never see a
      flash of unstyled text, but stays in the DOM for crawlers that do not run
      JavaScript (Bing, GPTBot, ClaudeBot, PerplexityBot, social scrapers) and
      becomes visible if JS fails or is disabled.
    -->
    <style>
      .seo-shell{max-width:48rem;margin:0 auto;padding:5rem 1rem 3rem;font:16px/1.65 Geist,system-ui,-apple-system,sans-serif;color:#111;opacity:0;animation:seo-shell-reveal 0s 2.5s forwards}
      html.dark .seo-shell{color:#e4e4e7}
      .seo-shell a{color:inherit;text-underline-offset:3px}
      .seo-shell nav a{margin-right:1rem}
      .seo-shell h1{font-size:1.9rem;line-height:1.2;margin:1.75rem 0 .5rem}
      .seo-shell h2{font-size:1.25rem;margin:2rem 0 .5rem}
      .seo-shell h3{font-size:1.05rem;margin:1.25rem 0 .25rem}
      .seo-shell li{margin:.25rem 0}
      @keyframes seo-shell-reveal{to{opacity:1}}
    </style>
    <noscript>
      <style>.seo-shell{opacity:1!important;animation:none!important}</style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
