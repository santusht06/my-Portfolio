name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  validate-and-build:
    name: Validate & Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Validate Cloudflare Worker Syntax
        working-directory: backend
        run: |
          echo "🔍 Checking Cloudflare Worker syntax..."
          node --check src/index.js

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          echo "📦 Installing frontend packages..."
          npm ci

      - name: Build Frontend & Test SSG Prerendering
        working-directory: frontend
        run: |
          echo "⚡ Compiling production bundle & generating static SEO pages..."
          npm run build

  deploy-cloudflare-worker:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    needs: validate-and-build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: backend
