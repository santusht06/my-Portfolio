name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  validate-and-build:
    name: Validate & Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Validate Cloudflare Worker Syntax
        working-directory: backend
        run: |
          echo "🔍 Checking Cloudflare Worker syntax..."
          node --check src/index.js

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          echo "📦 Installing frontend packages..."
          npm ci

      - name: Build Frontend & Test SSG Prerendering
        working-directory: frontend
        run: |
          echo "⚡ Compiling production bundle & generating static SEO pages..."
          npm run build

  decommission-ground-server:
    name: Decommission Legacy Ground Server
    runs-on: ubuntu-latest
    needs: validate-and-build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Stop Daemons & Wipe Legacy Files on Ground Server
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          timeout: 60s
          script: |
            echo "=========================================="
            echo "🛑 DECOMMISSIONING GROUND ERA SERVER..."
            echo "=========================================="
            
            # 1. Stop and disable portfolio-backend systemd daemon
            echo "🛑 Stopping portfolio-backend service..."
            sudo systemctl stop portfolio-backend.service || systemctl stop portfolio-backend.service || true
            sudo systemctl disable portfolio-backend.service || systemctl disable portfolio-backend.service || true
            
            # 2. Stop and disable Nginx to release ports 80/443
            echo "🛑 Stopping Nginx..."
            sudo systemctl stop nginx || systemctl stop nginx || true
            sudo systemctl disable nginx || systemctl disable nginx || true

            # 3. Wipe legacy deployed files from /var/www/my-Portfolio
            echo "🧹 Removing legacy files from /var/www/my-Portfolio..."
            sudo rm -rf /var/www/my-Portfolio/* 2>/dev/null || rm -rf /var/www/my-Portfolio/* 2>/dev/null || true
            
            echo "=========================================="
            echo "✅ Ground era server successfully decommissioned!"
            echo "Traffic now routes to Vercel (frontend) & Cloudflare Workers (backend)."
            echo "=========================================="

  deploy-cloudflare-worker:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    needs: validate-and-build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: backend
